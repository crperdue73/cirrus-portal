name: secret-scan

# Plan item 3 — leak guard. Greps the repo (and a built release tarball) for
# gateway tokens, admin passwords, device seeds, private keys, and forbidden
# runtime-state files. Folded into the full CI suite in plan item 13.

on:
  push:
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for secrets
        run: ./secret-scan.sh

      - name: Build release tarball and scan it
        run: |
          ./release.sh
          ./secret-scan.sh --tar "$(ls -1 dist/*.tar.gz | head -1)"
