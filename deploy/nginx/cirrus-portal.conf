# ═══════════════════════════════════════════════════════════════════════════
#  Cirrus Portal — nginx reverse proxy template (TLS termination)
# ═══════════════════════════════════════════════════════════════════════════
#  Replace __DOMAIN__ with your hostname (e.g. portal.example.com) and
#  __PORTAL_PORT__ with the portal's port (default 18800).
#
#  Certificates: get them with certbot, e.g.
#    sudo certbot certonly --webroot -w /var/www/certbot -d __DOMAIN__
#  (the port-80 block serves the ACME challenge from that webroot)
#
#  Then:
#    sudo cp cirrus-portal.conf /etc/nginx/sites-available/cirrus-portal
#    sudo ln -s /etc/nginx/sites-available/cirrus-portal /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  The portal must be bound to loopback (127.0.0.1:__PORTAL_PORT__) with
#  tlsMode:"manual" (or trustProxy:true) so it marks cookies Secure + HSTS.
# ═══════════════════════════════════════════════════════════════════════════

upstream cirrus_portal {
    server 127.0.0.1:__PORTAL_PORT__;
    keepalive 16;
}

# ── 80 → 443 redirect (+ ACME challenge) ────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443 TLS ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (HSTS makes browsers stick to HTTPS for a year).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        proxy_pass http://cirrus_portal;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # The portal reads this to mark cookies Secure + emit HSTS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (chat + room streams): no buffering, long timeout.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
